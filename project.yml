name: Switchboard
options:
  bundleIdPrefix: com.sagarvarma
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    # Ad-hoc by default so anyone can build it. scripts/release.sh signs public releases itself.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "4"
packages:
  SwitchboardCore:
    path: .
targets:
  Switchboard:
    type: application
    platform: macOS
    sources: [Sources/Switchboard, Resources/Assets.xcassets]
    dependencies:
      - package: SwitchboardCore
      - sdk: Carbon.framework
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Switchboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        LSUIElement: true
        NSHighResolutionCapable: true
        NSAppleEventsUsageDescription: Switchboard uses Apple Events to show the text of the Terminal or iTerm2 tab running a Claude Code session in its Dashboard, and to bring that tab to the front.
    entitlements:
      path: Resources/Switchboard.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sagarvarma.switchboard
        PRODUCT_NAME: Switchboard
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
